name: CI

on:
  pull_request:
    branches: [main]
  # Вызывается из deploy.yml как reusable workflow
  workflow_call:

env:
  TELEGRAM_TOKEN: test
  DEEPSEEK_API_KEY: test
  THESPORTSDB_KEY: test
  DA_CLIENT_ID: test
  DA_CLIENT_SECRET: test
  DA_ACCESS_TOKEN: test
  DA_PROFILE_URL: https://www.donationalerts.com/r/test
  ANALYSIS_PRICE_RUB: "150"
  MAIN_ADMIN_ID: "0"
  SUPPORT_USERNAME: test

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint with flake8
        run: |
          flake8 . --max-line-length=120 --exclude=.git,__pycache__,.venv,venv

      - name: Run tests
        run: |
          pytest tests/ -v

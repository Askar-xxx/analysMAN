name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Create config stub
        run: |
          echo 'TOKEN = "test"' > config.py
          echo 'DEEPSEEK_API_KEY = "test"' >> config.py
          echo 'THESPORTSDB_KEY = "test"' >> config.py

      - name: Lint with flake8
        run: |
          flake8 . --max-line-length=120 --exclude=.git,__pycache__,.venv,venv

      - name: Run tests
        run: |
          pytest tests/ -v

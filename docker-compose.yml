services:
  bot:
    build: .
    image: sports-bot:latest
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/bash", "docker-entrypoint.sh"]
    volumes:
      # База данных и кэш анализов — персистентны между перезапусками
      - bot_data:/app/analysis_cache
      - ./sports_bot.db:/app/sports_bot.db
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  bot_data:
